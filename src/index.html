<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Aird — Quick File Storage</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <path d="M12 18v-6"/>
          <path d="m9.5 15.5 2.5 2.5 2.5-2.5"/>
        </svg>
        <div>
          <h1>Aird File Drop</h1>
          <p class="subtitle">Upload, share, and download files from one link</p>
        </div>
      </div>
      <dl class="stats" aria-label="Storage summary">
        <div class="stat-pill">
          <dt>Files</dt>
          <dd id="stat-count">—</dd>
        </div>
        <div class="stat-pill">
          <dt>Total size</dt>
          <dd id="stat-size">—</dd>
        </div>
      </dl>
    </div>
  </header>

  <main class="container main-content">
    <section class="upload-panel" aria-labelledby="upload-heading">
      <h2 id="upload-heading" class="visually-hidden">Upload files</h2>
      <form id="upload-form" action="/api/upload" method="POST" enctype="multipart/form-data">
        <input
          id="file-input"
          name="files"
          type="file"
          multiple
          class="visually-hidden"
        >
        <label id="dropzone" for="file-input" class="dropzone" data-drag-active="false">
          <svg class="dropzone-icon" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span id="dropzone-title" class="dropzone-title">Drag and drop files here, or click to browse</span>
          <span class="dropzone-hint">Supports multiple files up to 500 MB each</span>
          <span class="btn btn-primary dropzone-cta">Choose files</span>
        </label>
      </form>

      <div id="upload-progress-wrap" class="upload-progress-wrap" hidden>
        <div class="upload-progress-meta">
          <label for="upload-progress" id="upload-progress-label">Uploading…</label>
          <span id="upload-progress-pct" class="upload-progress-pct">0%</span>
        </div>
        <progress id="upload-progress" value="0" max="100"></progress>
      </div>
    </section>

    <section class="toolbar" aria-label="Filter and sort files">
      <search class="search-box">
        <label for="search-input" class="visually-hidden">Filter files by name or path</label>
        <input
          id="search-input"
          type="search"
          placeholder="Filter files by name or extension…"
          autocomplete="off"
        >
      </search>

      <div class="sort-control">
        <label for="sort-select">Sort by</label>
        <select id="sort-select">
          <option value="date-desc">Newest first</option>
          <option value="name-asc">Name (A–Z)</option>
          <option value="name-desc">Name (Z–A)</option>
          <option value="size-desc">Largest first</option>
          <option value="size-asc">Smallest first</option>
        </select>
      </div>
    </section>

    <p id="status-banner" class="status-banner" role="status" aria-live="polite"></p>

    <div tabindex="0" role="region" aria-labelledby="files-caption" class="table-wrapper">
      <table id="files-table">
        <caption id="files-caption" class="visually-hidden">Available files for download</caption>
        <thead>
          <tr>
            <th scope="col">File</th>
            <th scope="col">Type</th>
            <th scope="col">Size</th>
            <th scope="col">Uploaded</th>
            <th scope="col" class="col-actions">Actions</th>
          </tr>
        </thead>
        <tbody id="files-body">
          <tr>
            <td colspan="5" class="empty-cell">Loading files…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Files uploaded here are stored in Vercel Blob for instant download links.</p>
      <p id="build-time" class="build-time"></p>
    </div>
  </footer>
</body>
</html>
